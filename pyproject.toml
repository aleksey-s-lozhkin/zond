[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zond-ects"
version = "1.0.2"
description = "ЗОНД: ECTS — настольное приложение для проведения проверок оборудования"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Aleksey Lozhkin" }]
keywords = ["inspection", "checklist", "flet", "ects"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "flet==0.86.5",
    "reportlab>=4.0",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
zond-ects = "zond.ects:run"

[project.urls]
Homepage = "https://github.com/aleksey-s-lozhkin/ECTS"

[tool.setuptools]
packages = ["zond", "zond.app", "zond.models", "zond.services", "zond.ui",
            "zond.ui.components", "zond.ui.screens", "zond.ui.widgets", "zond.utils"]

# ------------------------------------------------------------ flet build
#
# Конфигурация сборки приложения: flet build apk | aab | ipa | macos | windows.
# Подробности и порядок установки инструментов — в docs/mobile.md.

[tool.flet]
# Обратный домен владельца приложения: из него собирается идентификатор
# пакета. Идентификатор после публикации менять нельзя.
org = "ru.pyconstrictor"
bundle_id = "ru.pyconstrictor.zond"
product = "ЗОНД: ECTS"
company = "pyconstrictor.ru"
copyright = "© 2026 pyconstrictor.ru"
build_number = 3

# Каталоги и файлы, не нужные внутри приложения. Виртуальное окружение
# исключать обязательно: иначе в пакет попадёт сама среда разработки.
[tool.flet.app]
exclude = [
    ".venv",
    ".git",
    ".idea",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "reports",
    "tests",
    "tools",
    "docs",
]

# На iOS каталог документов приложения открывается в приложении «Файлы»
# только с этими ключами — иначе забрать протокол можно лишь через «Поделиться».
[tool.flet.ios.info]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true

# Оформление заставки при запуске.
[tool.flet.splash]
color = "#2563EB"
dark_color = "#1D4ED8"
android = true
ios = true

# --------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PIE", # flake8-pie
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # длина строки контролируется форматтером
    "B008",   # вызов функции в значении по умолчанию (нужен для Flet)
    "RUF012", # ClassVar для изменяемых атрибутов класса
    # RUF001-003 ищут «неоднозначные» символы (кириллические а/с/е) —
    # для проекта с русскоязычными docstring это ложные срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SLF001", # тесты намеренно вызывают приватные методы экранов
    "B011",   # assert False в тестах допустим
]
"zond/ui/icons.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["zond"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:zond.*",
]
