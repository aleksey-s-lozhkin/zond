name: Android APK

# Сборка установочного файла. Запускается по тегу вида v1.0.0 — тогда APK
# прикрепляется к релизу, откуда его скачивают без входа в GitHub. Вручную
# сборку можно запустить из вкладки Actions: файл будет доступен как артефакт
# запуска.
#
# В репозитории APK не хранится: он весит около 150 МБ, а история git
# неизменяема — каждый клон тянул бы все версии сразу.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # JDK нужен Android-сборке; на локальной машине его роль играет
      # встроенный в Android Studio.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер и тесты
        run: |
          ruff check .
          ruff format --check .
          pytest

      # Flutter для сборки flet скачивает сам: ему нужна своя версия, и та,
      # что стоит на машине разработчика, может не подойти. Первая сборка из-за
      # этого долгая — это ожидаемо.
      #
      # Ключ подписи берётся из секретов. Без своего ключа сборка подписывается
      # отладочным, который на каждом запуске новый, и такая версия не
      # установится поверх прежней: Android отвечает «signatures do not match».
      - name: Подготовка ключа подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # Релиз без своего ключа выпускать нельзя: он не установится
            # поверх прежней версии. Ручной запуск без ключа допускается —
            # такой файл годится только для проверки.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан, а сборка идёт по тегу. Выпуск был бы подписан отладочным ключом и не установился бы поверх прежней версии."
              exit 1
            fi

            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан. APK будет подписан отладочным ключом — только для проверки, не для выпуска."
            exit 0
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zond-upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/zond-upload.jks" >> "$GITHUB_ENV"

      - name: Сборка APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flet build apk --yes

      # Проверка самой подписи, а не факта наличия секрета: ключ мог быть задан
      # неверно, и сборка молча ушла бы с отладочной подписью.
      - name: Проверка подписи
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certificates="$("$signer" verify --print-certs build/apk/*.apk | grep 'certificate DN' | head -1)"
          echo "$certificates"

          if echo "$certificates" | grep -q "Android Debug"; then
            echo "::error::APK подписан отладочным ключом — обновление не установится поверх прежней версии. Проверьте секреты подписи."
            exit 1
          fi

      - name: Размер файла
        run: du -h build/apk/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: zond-ects-apk
          path: build/apk/*.apk
          if-no-files-found: error

      # По тегу APK прикрепляется к релизу: оттуда его можно скачать и
      # установить на телефон без учётной записи GitHub.
      #
      # Релиз мог быть создан вручную — тогда тег уже существует, и запуск
      # состоялся именно из-за него. Создавать релиз повторно нельзя, поэтому
      # файл в этом случае заменяется в существующем.
      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Релиз уже есть — заменяем прикреплённый файл"
            gh release upload "${GITHUB_REF_NAME}" build/apk/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/apk/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
